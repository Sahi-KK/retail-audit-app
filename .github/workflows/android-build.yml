name: 'Audit App Standalone Build'

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual build triggers

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout Repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java (Android Native tools)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🚀 Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔨 Build Standalone APK (EAS Local)
        # We use --local to avoid the EAS cloud queue
        run: npx eas-cli build --platform android --profile preview --non-interactive --local --output=./retail-audit-v1.apk

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: retail-audit-apk
          path: ./retail-audit-v1.apk
