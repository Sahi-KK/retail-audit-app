name: 'Audit App Standalone Build'

on:
  push:
    branches: [main]
    paths:
      - 'app.json'
      - 'eas.json'
      - '.github/workflows/android-build.yml'
      - 'assets/images/**'
  workflow_dispatch: # Allows manual build triggers

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout Repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java (Android Native tools)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🚀 Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔨 Build Standalone APK (Expo Cloud)
        # We switch to cloud build for the first run to handle automatic Keystore generation
        run: npx eas-cli build --platform android --profile preview --non-interactive

      # Note: Cloud builds provide the URL in the logs.
      # You can also use 'eas build:list' to see them.
