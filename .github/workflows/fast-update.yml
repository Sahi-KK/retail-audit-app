name: 'Ghost Pulse: Instant App Update'

on:
  push:
    branches: [main]
    # We ONLY trigger fast updates for JS/App code (not native config)
    paths:
      - 'app/**'
      - 'components/**'
      - 'constants/**'
      - 'services/**'
      - 'store/**'
      - 'hooks/**'
      - 'assets/**'
      - 'data/**'
      - 'package.json'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout Repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🚀 Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: ⚡ Publish Ghost Pulse (OTA Update)
        # This ensures the channel is linked to the branch and then publishes the update
        run: |
          eas channel:edit production --branch production --non-interactive
          eas update --branch production --message "Ghost Pulse: Automated Operative Update" --non-interactive
