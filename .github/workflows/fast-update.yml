name: 'Ghost Pulse: Instant App Update'

on:
  push:
    branches: [main]
    # We ONLY trigger fast updates for JS/App code (not native config)
    paths:
      - 'app/**'
      - 'components/**'
      - 'constants/**'
      - 'services/**'
      - 'store/**'
      - 'hooks/**'
      - 'assets/**'
      - 'package.json'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout Repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🚀 Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        run: npm install

      - name: ⚡ Publish Ghost Pulse (OTA Update)
        # This publishes an update to the 'production' channel which the APK listens to
        run: npx eas-cli update --branch production --message "Ghost Pulse: Automated Operative Update" --non-interactive
