name: "Enterprise Portal: Live Deployment"

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🛰️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Portal Dependencies
        run: |
          cd web-portal
          npm ci --prefer-offline --no-audit

      - name: 🛠️ Build Enterprise Bundle
        run: |
          cd web-portal
          npm run build
          touch dist/.nojekyll

      - name: 🚀 Deploy to Live URL
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web-portal/dist
          branch: gh-pages

